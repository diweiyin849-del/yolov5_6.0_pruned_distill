# YOLOv5 🚀 by Ultralytics, GPL-3.0 license

# Parameters
nc: 7  # number of classes
depth_multiple: 0.33  # model depth multiple
width_multiple: 0.50  # layer channel multiple
anchors: 3

# YOLOv5 v6.0 backbone
backbone:
  # [from, number, module, args]
  [[-1, 1, GhostConv, [64, 3, 2]],  # 0-P1/2
   [-1, 1, GhostConv, [128, 3, 2]],  # 1-P2/4
   [-1, 3, C3SPP, [128]],
   [-1, 1, GhostConv, [256, 3, 2]],  # 3-P3/8
   [-1, 6, C3SPP, [256]],
   [-1, 1, GhostConv, [512, 3, 2]],  # 5-P4/16
   [-1, 9, C3SPP, [512]],
   [-1, 1, GhostConv, [1024, 3, 2]],  # 7-P5/32
   [-1, 3, C3SPP, [1024]],
   [-1, 1, SPP, [1024]],  # 9
  ]

# YOLOv5 v6.0 head
head:
  [[-1, 1, GhostConv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1,6], 1, Concat_bifpn, [256,256]],  # cat backbone P4
   [-1, 3, C3SPP, [512, False]],  # 13  40

   [-1, 1, GhostConv, [256, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1,4], 1, Concat_bifpn, [256,256]],  # cat backbone P4
   [-1, 3, C3SPP, [256, False]],  # 17 (P3/8-small) 80

   [-1, 1, GhostConv, [128, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1,2], 1, Concat_bifpn, [128,128]],  # cat backbone P4
   [-1, 1, C3SPP, [128, False]],  # 21 (P2/4-xsmall)
   [-1, 1, SLAM, [128]], #22   160

   [-1, 1, GhostConv, [128, 3, 2]], # 80
   [[-1,18], 1, Concat_bifpn, [128,128]],  # cat backbone P4
   [-1, 3, C3SPP, [256, False]],  # 25 (P3/8-small)
   [-1, 1, SLAM, [256]], #26

   [-1, 1, GhostConv, [256, 3, 2]],
   [[-1,14], 1, Concat_bifpn, [256,256]],  # cat backbone P4
   [-1, 3, C3SPP, [512, False]],  # 27 (P4/16-medium)
   [-1, 1, SLAM, [512]], #30

   [-1, 1, GhostConv, [512, 3, 2]],
   [[-1,10], 1, Concat_bifpn, [512,512]],  # cat backbone P4
   [-1, 3, C3SPP, [1024, False]],  # 33 (P5/32-large)
   [-1, 1, SLAM, [1024]], #34

   [[22, 26, 30, 34], 1, Detect, [nc, anchors]],  # Detect(P2, P3, P4, P5)
  ]
