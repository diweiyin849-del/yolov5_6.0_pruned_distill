# Hyperparameters for VOC finetuning
# python yolo26s-visdrone-4output-map0.398.py --batch 64 --weights yolov5m.pt --data VOC.yaml --img 512 --epochs 50
# See tutorials for hyperparameter evolution https://github.com/ultralytics/yolov5#tutorials

# ========== 学习率 ==========
lr0: 0.0001              # 初始学习率 ✅
lrf: 0.001               # ← 改成 0.001（最终 lr = 0.0001 × 0.001 = 0.0000001）
momentum: 0.937
weight_decay: 0.0005

# ========== Warmup ==========
warmup_epochs: 1.0       # ← 改成 1.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# ========== Loss权重（保持不变）==========
box: 0.05
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 0.0

# ========== ⚠️ 关键：关闭数据增强 ==========
hsv_h: 0.0               # ← 改成 0
hsv_s: 0.0               # ← 改成 0
hsv_v: 0.0               # ← 改成 0
degrees: 0.0
translate: 0.0           # ← 改成 0
scale: 0.0               # ← 改成 0
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.0              # ← 改成 0
mosaic: 0.0              # ← 改成 0（最重要！）
mixup: 0.0
copy_paste: 0.0